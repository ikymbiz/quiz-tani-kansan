<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>単位の王国だいぼうけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF4DC;--paper-dark:#F4E4B8;--ink:#2A2520;--ink-soft:#5C4B3D;--primary:#E63946;--gold:#F4B942;--sky:#4A90C2;--leaf:#5BAA5F;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'M PLUS Rounded 1c',sans-serif;background:var(--paper);background-image:radial-gradient(circle at 20% 30%,rgba(244,185,66,.12) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(74,144,194,.08) 0%,transparent 50%),repeating-linear-gradient(0deg,transparent 0,transparent 24px,rgba(92,75,61,.04) 24px,rgba(92,75,61,.04) 25px);color:var(--ink);min-height:100vh;padding:16px;line-height:1.6;}
.app{max-width:540px;margin:0 auto;}
.header{text-align:center;padding:12px 0 20px;}
.header__label{display:inline-block;font-family:'DotGothic16',monospace;font-size:11px;background:var(--ink);color:var(--paper);padding:3px 10px;letter-spacing:.2em;margin-bottom:8px;}
.header__title{font-family:'DotGothic16',monospace;font-size:26px;color:var(--primary);text-shadow:3px 3px 0 var(--ink);line-height:1.2;letter-spacing:.05em;}
.header__sub{font-size:12px;color:var(--ink-soft);margin-top:6px;letter-spacing:.1em;}
.card{background:#FFFCF2;border:3px solid var(--ink);border-radius:18px;padding:22px 18px;box-shadow:6px 6px 0 var(--ink);margin-bottom:18px;}
.section-title{font-family:'DotGothic16',monospace;font-size:15px;color:var(--ink);margin:14px 0 10px;padding-bottom:6px;border-bottom:2px dashed var(--ink-soft);display:flex;align-items:center;gap:8px;}
.section-title:first-child{margin-top:0;}
.section-title::before{content:'▶';color:var(--primary);}
.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px;}
.choice-grid--solo{grid-template-columns:1fr;}
.choice-grid--3{grid-template-columns:repeat(3,1fr);}
.stage-header{font-family:'DotGothic16',monospace;font-size:11px;color:var(--ink-soft);margin:10px 0 4px;letter-spacing:.1em;display:flex;align-items:center;gap:6px;}
.stage-header::before{content:'◆';color:var(--gold);font-size:10px;}
.stage-header:first-child{margin-top:2px;}
.choice{background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);line-height:1.3;}
.choice:active{transform:translate(2px,2px);}
.choice.is-selected{background:var(--primary);color:#FFFCF2;box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px);}
.choice--full{grid-column:1/-1;background:linear-gradient(135deg,#FFE5C4,var(--gold));border-color:var(--ink);padding:14px 8px;font-size:14px;}
.choice--full.is-selected{background:linear-gradient(135deg,var(--primary),#C42B38);color:#FFFCF2;}
.choice__icon{font-size:24px;display:block;margin-bottom:2px;}
.choice__sub{display:block;font-size:10px;font-weight:500;margin-top:2px;opacity:.7;}
.choice.is-selected .choice__sub{opacity:.95;}
.choice__stars{font-family:'DotGothic16',monospace;color:var(--gold);font-size:11px;letter-spacing:.05em;display:block;margin-bottom:2px;}
.choice.is-selected .choice__stars{text-shadow:1px 1px 0 var(--ink);color:var(--gold);}
.choice__example{display:block;font-size:10px;margin-top:3px;font-family:'DotGothic16',monospace;opacity:.85;letter-spacing:.02em;}
.btn{font-family:inherit;font-weight:800;font-size:17px;padding:14px 24px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;width:100%;background:var(--gold);color:var(--ink);box-shadow:5px 5px 0 var(--ink);transition:all .1s;letter-spacing:.05em;margin-top:14px;}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
.btn--primary{background:var(--primary);color:#FFFCF2;}
.btn--leaf{background:var(--leaf);color:#FFFCF2;}
.btn--small{font-size:14px;padding:10px 16px;box-shadow:3px 3px 0 var(--ink);}
.btn--ghost{background:transparent;box-shadow:none;border-color:var(--ink-soft);color:var(--ink-soft);}
.quiz-bar{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;margin-bottom:10px;font-family:'DotGothic16',monospace;font-size:12px;letter-spacing:.08em;}
.quiz-bar__mode{background:var(--gold);color:var(--ink);padding:2px 6px;border-radius:4px;font-size:10px;margin-right:6px;}
.quiz-bar__lv{background:var(--leaf);color:#FFFCF2;padding:2px 6px;border-radius:4px;font-size:10px;margin-right:6px;}
.quiz-bar__score{color:var(--gold);}
.progress{height:10px;background:var(--paper-dark);border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-bottom:16px;}
.progress__fill{height:100%;background:var(--leaf);transition:width .4s cubic-bezier(.34,1.3,.64,1);background-image:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(255,255,255,.2) 6px,rgba(255,255,255,.2) 12px);}
.character-bubble{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
.character{flex-shrink:0;width:56px;height:56px;background:var(--gold);border:2.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:2px 2px 0 var(--ink);}
.character.--mili{background:var(--sky);}
.character.--centi{background:var(--leaf);}
.bubble{background:#FFFCF2;border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--ink-soft);position:relative;flex:1;}
.bubble::before{content:'';position:absolute;left:-10px;top:14px;width:0;height:0;border:8px solid transparent;border-right-color:var(--ink);}
.bubble::after{content:'';position:absolute;left:-6px;top:16px;width:0;height:0;border:6px solid transparent;border-right-color:#FFFCF2;}
.question-card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:22px 18px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink);position:relative;}
.question-card::before{content:'もんだい';position:absolute;top:-12px;left:14px;background:var(--primary);color:#FFFCF2;font-family:'DotGothic16',monospace;font-size:11px;padding:3px 10px;border:2px solid var(--ink);border-radius:6px;letter-spacing:.15em;}
.question-card--slide::before{content:'まなぶ';background:var(--leaf);}
.question-text{font-size:16px;font-weight:500;line-height:1.85;color:var(--ink);}
.question-text .num{font-weight:800;color:var(--primary);font-size:1.12em;padding:0 2px;}
.question-text--drill{text-align:center;font-size:26px;font-weight:800;line-height:1.5;padding:8px 0;letter-spacing:.02em;}
.question-text--drill .num{font-size:1em;}
.question-text--drill .equals{color:var(--ink-soft);margin:0 8px;}
.question-text--drill .blank{display:inline-block;min-width:50px;border-bottom:3px solid var(--ink);color:var(--gold);padding:0 6px;}
/* === 単位ボックス === */
.unit-box{display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:10px;background:#FFFCF2;margin:12px auto;max-width:360px;overflow:hidden;box-shadow:3px 3px 0 var(--ink);}
.unit-box__row{display:flex;}
.unit-box__row + .unit-box__row{border-top:2px solid var(--ink);}
.unit-box__cell{flex:1;padding:10px 4px;text-align:center;font-weight:700;font-size:18px;min-height:44px;display:flex;align-items:center;justify-content:center;border-right:1.5px solid var(--ink-soft);}
.unit-box__cell:last-child{border-right:none;}
.unit-box__row--header .unit-box__cell{background:var(--ink);color:var(--paper);font-family:'DotGothic16',monospace;font-size:13px;letter-spacing:.05em;}
.unit-box__cell--filled{color:var(--primary);font-size:22px;background:rgba(244,185,66,.18);}
.unit-box__cell--blank{color:var(--gold);font-size:26px;background:#FFF;border:2px dashed var(--gold);font-family:'DotGothic16',monospace;}
.unit-box__cell--empty{background:rgba(244,228,184,.3);color:#CCC;}
.unit-box__cell--zero{color:var(--leaf);font-size:22px;background:#DFF5DC;}
/* === チュートリアル === */
.tutorial-slide{padding:4px;text-align:center;}
.tutorial-slide h3{font-family:'DotGothic16',monospace;color:var(--primary);font-size:17px;margin-bottom:10px;line-height:1.4;}
.tutorial-slide p{font-size:14px;line-height:1.7;color:var(--ink);margin:6px 0;}
.tutorial-slide .highlight{background:var(--gold);padding:2px 8px;border-radius:6px;font-weight:800;}
.tutorial-slide .arrow-right{font-size:24px;color:var(--leaf);font-weight:800;margin:4px;}
.tutorial-slide .arrow-left{font-size:24px;color:var(--sky);font-weight:800;margin:4px;}
.tutorial-slide strong{color:var(--primary);font-size:1.1em;}
.intro-q{text-align:center;font-size:16px;font-weight:700;margin-top:10px;color:var(--ink);}
.intro-q .num{color:var(--primary);}
/* === 単位リスト・比率表示 === */
.unit-list{list-style:none;padding:0;margin:10px 0;text-align:left;}
.unit-list li{padding:7px 12px;margin:5px 0;background:rgba(244,228,184,.4);border-radius:8px;font-size:13px;line-height:1.5;border-left:4px solid var(--gold);}
.unit-list li strong{color:var(--primary);font-family:'DotGothic16',monospace;font-size:1.1em;margin-right:4px;}
.tutorial-slide .ratio{display:inline-block;font-family:'DotGothic16',monospace;background:#FFFCF2;border:1.5px solid var(--ink);padding:2px 8px;margin:2px;border-radius:6px;font-size:12px;}
.tutorial-slide .big-rule{display:inline-block;background:var(--paper);border:2px solid var(--ink);padding:8px 14px;margin:6px 4px;border-radius:8px;font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--ink);}
/* === 解説音声ボタン === */
.audio-btn-row{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap;}
.audio-btn{display:inline-flex;align-items:center;gap:4px;background:var(--sky);color:#FFFCF2;border:2.5px solid var(--ink);border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:all .15s;}
.audio-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
.audio-btn.is-playing{background:var(--leaf);animation:pulse 1s infinite;}
.audio-btn--toggle{background:var(--paper-dark);color:var(--ink);}
.audio-btn--toggle.is-off{background:#E5E5E5;color:#888;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
/* === ナビ行（もどる＋つぎへ） === */
.post-row{display:flex;gap:8px;margin-top:14px;}
.post-row .btn{flex:1;margin-top:0;}
.post-row.is-empty{display:none;}
.btn--back{background:var(--paper-dark);color:var(--ink);}
/* === ルビ（ふりがな） === */
ruby{ruby-align:center;}
rt{font-size:0.6em;color:var(--ink-soft);font-weight:500;letter-spacing:0;line-height:1;}
.tutorial-slide rt{font-size:0.55em;color:var(--ink-soft);}
.rulebox rt{font-size:0.5em;}
/* === ホーム画面 === */
.home-card{display:flex;flex-direction:column;gap:14px;padding:24px 18px;}
.home-btn{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:24px 16px;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:5px 5px 0 var(--ink);transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.home-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
.home-btn--intro{background:linear-gradient(135deg,#FFE5C4,var(--gold));}
.home-btn--start{background:linear-gradient(135deg,var(--primary),#C42B38);color:#FFFCF2;}
.home-btn__icon{font-size:42px;line-height:1;}
.home-btn__title{font-family:'DotGothic16',monospace;font-size:16px;font-weight:800;letter-spacing:.05em;line-height:1.4;}
.home-btn__sub{font-size:11px;opacity:.85;letter-spacing:.05em;}
/* === モーダル === */
.modal-overlay{position:fixed;inset:0;background:rgba(42,37,32,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px;animation:fadeIn .25s ease;}
.modal-overlay.hidden{display:none;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:#FFFCF2;border:3px solid var(--ink);border-radius:18px;padding:20px 16px 18px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:6px 6px 0 var(--ink);animation:popIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal__step{font-family:'DotGothic16',monospace;font-size:11px;color:var(--ink-soft);text-align:center;letter-spacing:.2em;margin-bottom:4px;}
.modal__title{font-family:'DotGothic16',monospace;font-size:17px;color:var(--primary);text-align:center;margin-bottom:14px;text-shadow:2px 2px 0 var(--ink);}
.modal__back{display:inline-flex;align-items:center;gap:4px;background:var(--paper-dark);border:2px solid var(--ink);color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:6px 10px;margin-bottom:10px;border-radius:8px;}
.modal__back:active{transform:translate(1px,1px);}
.modal__close{position:absolute;top:8px;right:12px;background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.modal{position:relative;}
.modal__body{display:flex;flex-direction:column;gap:8px;}
.modal-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}

/* === 9桁スライド図（PDF準拠）=== */
/* === 9桁スライド図（マスが横一列）=== */
.slide9{background:#FFFCF2;border:2.5px solid var(--ink);border-radius:10px;padding:14px 6px 8px;margin:14px auto;overflow-x:auto;box-shadow:3px 3px 0 var(--ink);}
.slide9__row{display:flex;justify-content:center;align-items:center;gap:0;min-height:32px;}
.slide9__cell{width:30px;height:30px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'DotGothic16',monospace;font-size:13px;font-weight:700;flex-shrink:0;transition:all .3s ease;position:relative;}
.slide9__cell--length{background:#B8E5DA;}
.slide9__cell--weight{background:#F5C5DC;}
.slide9__cell--volume{background:#C8E5C0;}
.slide9__cell--filled{background:rgba(244,185,66,.55)!important;color:var(--primary);}
.slide9__cell--blank{background:#FFFCF2!important;color:var(--gold);border:2px dashed var(--gold);}
/* 音声同期アニメーション用 */
.slide9__cell--highlight{box-shadow:0 0 0 4px var(--gold),0 0 12px var(--gold);transform:scale(1.15);z-index:2;animation:cellGlow 0.8s ease infinite alternate;}
@keyframes cellGlow{from{box-shadow:0 0 0 4px var(--gold),0 0 8px var(--gold);}to{box-shadow:0 0 0 5px var(--gold),0 0 16px var(--gold);}}
.slide9__cell--popin{animation:popValue 0.4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popValue{0%{transform:scale(0);}50%{transform:scale(1.4);}100%{transform:scale(1);}}
.slide9__cell--reading{background:#FFE5C4!important;color:var(--primary)!important;}
.slide9__cell--reading::after{content:'👆';position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:18px;animation:bounce-finger 0.6s ease infinite alternate;pointer-events:none;}
@keyframes bounce-finger{from{transform:translate(-50%,0);}to{transform:translate(-50%,4px);}}
.slide9__cell-dot{position:absolute;right:-10px;bottom:-2px;font-size:32px;font-weight:900;color:var(--primary);line-height:0.5;animation:dotPop 0.5s cubic-bezier(.34,1.56,.64,1);z-index:3;text-shadow:1px 1px 0 #FFFCF2,-1px -1px 0 #FFFCF2,1px -1px 0 #FFFCF2,-1px 1px 0 #FFFCF2;}
@keyframes dotPop{0%{transform:scale(0);}50%{transform:scale(1.8);}100%{transform:scale(1);}}
.slide9__gap{width:10px;flex-shrink:0;height:30px;}
.slide9__row--labels{margin-top:6px;min-height:24px;}
.slide9__label{width:30px;height:22px;text-align:center;font-family:'DotGothic16',monospace;font-size:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.slide9__label--unit{color:var(--primary);font-weight:800;font-size:13px;}
.slide9__label--special{color:var(--primary);font-weight:800;font-size:13px;text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;}
.slide9__caption{text-align:center;font-size:11px;color:var(--ink-soft);margin-bottom:6px;font-family:'DotGothic16',monospace;letter-spacing:.05em;min-height:16px;}

/* === 3段階イメージ図（面積・体積） === */
/* === 立体・面積イメージ図（SVGベース・下辺揃え・全段段揃え） === */
.stages{display:flex;align-items:flex-start;justify-content:center;gap:14px;padding:14px 8px 8px;background:#FFFCF2;border:2.5px solid var(--ink);border-radius:12px;margin:12px auto;flex-wrap:wrap;box-shadow:3px 3px 0 var(--ink);}
.stage{display:flex;flex-direction:column;align-items:center;gap:0;min-width:80px;}
.stage__figure{display:flex;align-items:flex-end;justify-content:center;}
.stage__svg path,.stage__svg polygon,.stage__svg rect{stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;}
.stage__dim-line{width:60px;border-top:1.5px dashed var(--ink-soft);margin-top:4px;}
.stage__dim-row{font-family:'DotGothic16',monospace;font-size:11px;color:var(--ink);text-align:center;line-height:1.4;min-height:16px;}
.stage__label{font-family:'DotGothic16',monospace;font-size:13px;text-align:center;line-height:1.3;color:var(--ink);font-weight:700;margin-top:6px;min-height:18px;}
.stage__label .eq{display:block;color:var(--primary);font-size:0.95em;margin-top:2px;min-height:14px;}
.stage__caption{font-family:'DotGothic16',monospace;font-size:10px;text-align:center;line-height:1.3;color:var(--ink-soft);margin-top:4px;min-height:14px;}
.stage__caption strong{color:var(--primary);}

/* === ルールBox & 3ステップ === */
.rulebox{background:#FFE5C4;border:2.5px solid var(--ink);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:13px;line-height:1.7;text-align:center;box-shadow:2px 2px 0 var(--ink);}
.rulebox strong{color:var(--primary);}
.rulebox--small{font-size:12px;padding:8px 12px;}
.steps{display:flex;flex-direction:column;gap:8px;margin:14px 0;text-align:left;}
.step{background:#FFFCF2;border:2.5px solid var(--ink);border-radius:10px;padding:10px 12px 10px 48px;font-size:13px;position:relative;line-height:1.5;box-shadow:2px 2px 0 var(--ink);}
.step strong{color:var(--primary);}
.step__num{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;background:var(--gold);border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DotGothic16',monospace;font-size:16px;font-weight:800;}
/* === answer / feedback / etc === */
.answer-area{background:#FFFCF2;border:3px dashed var(--ink-soft);border-radius:14px;padding:18px 14px;margin-bottom:14px;}
.answer-label{font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:10px;letter-spacing:.1em;}
.answer-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;}
.input-group{display:flex;align-items:center;gap:4px;}
.num-input{width:90px;height:56px;border:3px solid var(--ink);border-radius:10px;font-family:inherit;font-size:24px;font-weight:800;text-align:center;color:var(--primary);background:var(--paper);outline:none;transition:all .15s;-moz-appearance:textfield;}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.num-input:focus{background:#FFFCF2;box-shadow:3px 3px 0 var(--gold);transform:translate(-1px,-1px);}
.unit-label{font-size:18px;font-weight:700;color:var(--ink);min-width:30px;}
.feedback{border-radius:14px;padding:16px;margin-bottom:14px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
.feedback--correct{background:#DFF5DC;}
.feedback--wrong{background:#FFE3DC;}
.feedback__title{font-family:'DotGothic16',monospace;font-size:22px;margin-bottom:8px;}
.feedback--correct .feedback__title{color:var(--leaf);}
.feedback--wrong .feedback__title{color:var(--primary);}
.feedback__answer{font-size:14px;font-weight:700;margin-bottom:8px;}
.feedback__explain{font-size:13px;color:var(--ink-soft);line-height:1.7;background:rgba(255,252,242,.6);padding:8px 10px;border-radius:8px;}
.result-hero{text-align:center;padding:16px 0;}
.result-medal{font-size:80px;margin-bottom:8px;animation:bounce .8s cubic-bezier(.34,1.56,.64,1);}
@keyframes bounce{0%{transform:scale(0) rotate(-180deg);}100%{transform:scale(1) rotate(0);}}

<script>
const NAMES=['たろう','はなこ','けんた','ゆい','さくら','ひろし','まこと','あかり'];
const ITEMS={length:['ロープ','リボン','ひも','テープ','はり金'],volume:['ジュース','お茶','ぎゅうにゅう','水','スープ'],weight:['お米','さとう','小麦こ','しお','りんご'],area:['花だん','畑','部屋','広場','プール'],cubic:['水そう','はこ','プール','ダンボール']};
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const fmt=(n)=>n.toLocaleString('ja-JP');
const eq=(a,b)=>Math.abs(a-b)<1e-9;

// ============================================================
// 解説音声（Web Speech API）
// ============================================================
let audioEnabled=true;
let jaVoice=null;
function initVoice(){
  if(!window.speechSynthesis) return;
  const vs=speechSynthesis.getVoices();
  jaVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'))||null;
}
if(window.speechSynthesis){
  speechSynthesis.onvoiceschanged=initVoice;
  initVoice();
}
function speak(text){
  if(!audioEnabled||!window.speechSynthesis||!text) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';
  u.rate=0.95;
  u.pitch=1.05;
  if(jaVoice) u.voice=jaVoice;
  u.onstart=()=>{document.getElementById('replay-btn')?.classList.add('is-playing');};
  u.onend=u.onerror=()=>{document.getElementById('replay-btn')?.classList.remove('is-playing');};
  speechSynthesis.speak(u);
}
function stopSpeak(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('replay-btn')?.classList.remove('is-playing');
}

const D=(eq,vals,units,exp,ch)=>({type:'drill',question:formatDrillEq(eq),answer:{values:vals,units},explanation:exp,character:ch});
const W=(q,vals,units,exp,ch)=>({type:'word',question:q,answer:{values:vals,units},explanation:exp,character:ch});

function formatDrillEq(s){
  return s
    .replace(/=/g,'<span class="equals">=</span>')
    .replace(/\?(km²|cm²|m²|ha|a|km|cm|mm|kg|mg|m³|cm³|m|dL|mL|L|t|g)/g,'<span class="blank">?</span> <span class="unit-label">$1</span>')
    .replace(/(\d[\d,.]*)(km²|cm²|m²|ha|km|cm|mm|kg|mg|m³|cm³|m|dL|mL|L|t|g|a)/g,'<span class="num">$1$2</span>');
}

// ============================================================
// 単位ボックス描画
// ============================================================
const BOX_HEADERS={length:['km','m','cm','mm'],volume:['L','dL','mL'],weight:['t','kg','g'],area:['km²','ha','a','m²','cm²'],cubic:['m³','cm³']};
function renderUnitBox(cat,values){
  // values: 各セルに表示するもの。null/'' = 空セル, '?' = 空欄, 数値 = 入力済み
  const headers=BOX_HEADERS[cat];
  let h='<div class="unit-box"><div class="unit-box__row unit-box__row--header">';
  for(const hd of headers) h+=`<div class="unit-box__cell">${hd}</div>`;
  h+='</div><div class="unit-box__row">';
  for(let i=0;i<headers.length;i++){
    const v=values[i];
    let cls='unit-box__cell';
    let c='';
    if(v==='?'){cls+=' unit-box__cell--blank';c='?';}
    else if(v===0||v==='0'){cls+=' unit-box__cell--zero';c=v;}
    else if(v!=null&&v!==''){cls+=' unit-box__cell--filled';c=v;}
    else cls+=' unit-box__cell--empty';
    h+=`<div class="${cls}">${c}</div>`;
  }
  return h+'</div></div>';
}

// ============================================================
// PDF準拠：9桁スライド図
// ============================================================
const SLIDE_LAYOUT={
  length:{3:'km',6:'m',8:'cm',9:'mm'},
  weight:{3:'kg',6:'g',9:'mg'},
  volume:{3:'kL',6:'L',7:'dL',9:'mL'}
};
const SLIDE_SPECIAL={length:[8],volume:[7]}; // 「場所で覚える」必要のある単位

function render9Cell(cat,contents={},caption='',boxId=''){
  const layout=SLIDE_LAYOUT[cat];
  const special=SLIDE_SPECIAL[cat]||[];
  const idAttr=boxId?` id="${boxId}"`:'';
  let cells='',labels='';
  for(let i=1;i<=9;i++){
    if(i===4||i===7){cells+='<div class="slide9__gap"></div>';labels+='<div class="slide9__gap"></div>';}
    const v=contents[i];
    let cls=`slide9__cell slide9__cell--${cat}`;
    let txt='';
    if(v==='?'){cls+=' slide9__cell--blank';txt='?';}
    else if(v!=null&&v!==''){cls+=' slide9__cell--filled';txt=v;}
    cells+=`<div class="${cls}" data-pos="${i}">${txt}</div>`;
    const lbl=layout[i]||'';
    let lblCls='slide9__label';
    if(lbl) lblCls+=special.includes(i)?' slide9__label--special':' slide9__label--unit';
    labels+=`<div class="${lblCls}">${lbl}</div>`;
  }
  const cap=caption?`<div class="slide9__caption">${caption}</div>`:'';
  return `<div class="slide9"${idAttr} data-cat="${cat}">${cap}<div class="slide9__row">${cells}</div><div class="slide9__row slide9__row--labels">${labels}</div></div>`;
}

// 数字を9桁ボックスの「単位の場所から左へ」配置
function placeDigits(value,srcCell){
  const s=String(Math.abs(value));
  const placed={};
  for(let i=0;i<s.length;i++){
    const cell=srcCell-i;
    if(cell>=1) placed[cell]=s[s.length-1-i];
  }
  return placed;
}

// ============================================================
// SVG立体図・面積図（水平線揃え・寸法ラベル付き）
// ============================================================
// 正方形SVG：1辺の長さsizePx、ラベル付き
function svgSquare(sizePx,fillColor='#B5D8E8'){
  const pad=2,total=sizePx+pad*2;
  return `<svg class="stage__svg" width="${total}" height="${total}" viewBox="0 0 ${total} ${total}" style="display:block;">
    <rect x="${pad}" y="${pad}" width="${sizePx}" height="${sizePx}" fill="${fillColor}"/>
  </svg>`;
}
// 立方体SVG（アイソメトリック投影：奥行き角30度）
function svgCube(sizePx,fillTop='#A8D5A0',fillFront='#C8E5C0',fillSide='#98C590'){
  const s=sizePx;
  const dx=s*0.4,dy=s*0.4;
  const pad=4;
  const w=s+dx+pad*2;
  const h=s+dy+pad*2;
  const ox=pad,oy=pad+dy;
  const front=`M ${ox} ${oy} L ${ox+s} ${oy} L ${ox+s} ${oy+s} L ${ox} ${oy+s} Z`;
  const top=`M ${ox} ${oy} L ${ox+dx} ${oy-dy} L ${ox+s+dx} ${oy-dy} L ${ox+s} ${oy} Z`;
  const side=`M ${ox+s} ${oy} L ${ox+s+dx} ${oy-dy} L ${ox+s+dx} ${oy+s-dy} L ${ox+s} ${oy+s} Z`;
  return `<svg class="stage__svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
    <path d="${top}" fill="${fillTop}"/>
    <path d="${side}" fill="${fillSide}"/>
    <path d="${front}" fill="${fillFront}"/>
  </svg>`;
}
function svgCubeGrid(sizePx,gridLines,fillTop='#A8D5A0',fillFront='#C8E5C0',fillSide='#98C590'){
  const s=sizePx;
  const dx=s*0.4,dy=s*0.4;
  const pad=4;
  const w=s+dx+pad*2;
  const h=s+dy+pad*2;
  const ox=pad,oy=pad+dy;
  const front=`M ${ox} ${oy} L ${ox+s} ${oy} L ${ox+s} ${oy+s} L ${ox} ${oy+s} Z`;
  const top=`M ${ox} ${oy} L ${ox+dx} ${oy-dy} L ${ox+s+dx} ${oy-dy} L ${ox+s} ${oy} Z`;
  const side=`M ${ox+s} ${oy} L ${ox+s+dx} ${oy-dy} L ${ox+s+dx} ${oy+s-dy} L ${ox+s} ${oy+s} Z`;
  let grid='';
  const step=s/gridLines;
  const dxStep=dx/gridLines, dyStep=dy/gridLines;
  for(let i=1;i<gridLines;i++){
    grid+=`<line x1="${ox+i*step}" y1="${oy}" x2="${ox+i*step}" y2="${oy+s}" stroke="#5C4B3D" stroke-width="0.4" opacity="0.5"/>`;
    grid+=`<line x1="${ox}" y1="${oy+i*step}" x2="${ox+s}" y2="${oy+i*step}" stroke="#5C4B3D" stroke-width="0.4" opacity="0.5"/>`;
    grid+=`<line x1="${ox+i*step}" y1="${oy}" x2="${ox+i*step+dx}" y2="${oy-dy}" stroke="#5C4B3D" stroke-width="0.4" opacity="0.5"/>`;
    grid+=`<line x1="${ox+i*dxStep}" y1="${oy-i*dyStep}" x2="${ox+s+i*dxStep}" y2="${oy-i*dyStep}" stroke="#5C4B3D" stroke-width="0.4" opacity="0.5"/>`;
    grid+=`<line x1="${ox+s}" y1="${oy+i*step}" x2="${ox+s+dx}" y2="${oy+i*step-dy}" stroke="#5C4B3D" stroke-width="0.4" opacity="0.5"/>`;
    grid+=`<line x1="${ox+s+i*dxStep}" y1="${oy-i*dyStep}" x2="${ox+s+i*dxStep}" y2="${oy+s-i*dyStep}" stroke="#5C4B3D" stroke-width="0.4" opacity="0.5"/>`;
  }
  return `<svg class="stage__svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
    <path d="${top}" fill="${fillTop}"/>
    <path d="${side}" fill="${fillSide}"/>
    <path d="${front}" fill="${fillFront}"/>
    ${grid}
  </svg>`;
}

// 入門問題ヘルパー：9桁ボックス＋質問
const I=(cat,contents,questionText,vals,units,exp,ch)=>({type:'intro',question:render9Cell(cat,contents)+`<p class="intro-q">${questionText}</p>`,answer:{values:vals,units},explanation:exp,character:ch});
// チュートリアルスライド（html, narration, character, animations）
// animations: [{at: 秒, type: 'highlight'|'set'|'clear'|'pop', pos: 1-9, value: '...', boxId: 'tut-box-1'}]
const S=(html,nar,ch,anims)=>({type:'slide',question:`<div class="tutorial-slide">${addRuby(html)}</div>`,narration:nar||'',character:ch,animations:anims||[]});

// 漢字にルビを振るヘルパー（決まった単語に自動でふりがなを付与）
const RUBY_DICT={
  // 長い語（複合語）を最優先で処理
  '小数点':'しょうすうてん','単位':'たんい','面積':'めんせき','体積':'たいせき',
  '段階':'だんかい','立方':'りっぽう','計算':'けいさん','問題':'もんだい',
  '場所':'ばしょ','円玉':'えんだま','右':'みぎ','左':'ひだり',
  // 単漢字（誤読を起こさないもののみ）
  '長':'なが','重':'おも','例':'れい','読':'よ','書':'か',
  '聞':'き','図':'ず','向':'む','使':'つか','同':'おな',
  '変':'か','厚':'あつ','指':'ゆび','幅':'はば','倍':'ばい','高':'たか','箱':'はこ',
  '約':'やく','広':'ひろ','深':'ふか','回':'かい',
};
function addRuby(html){
  let out='',i=0,inRuby=false;
  while(i<html.length){
    if(html[i]==='<'){
      const end=html.indexOf('>',i);
      const tag=html.substring(i,end+1);
      if(/^<ruby[\s>]/.test(tag)) inRuby=true;
      else if(/^<\/ruby>/.test(tag)) inRuby=false;
      out+=tag;
      i=end+1;
    }else{
      const next=html.indexOf('<',i);
      const chunk=next===-1?html.substring(i):html.substring(i,next);
      if(inRuby){
        out+=chunk;
      }else{
        let processed=chunk;
        const keys=Object.keys(RUBY_DICT).sort((a,b)=>b.length-a.length);
        for(const k of keys){
          const re=new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
          processed=processed.replace(re,`<ruby>${k}<rt>${RUBY_DICT[k]}</rt></ruby>`);
        }
        out+=processed;
      }
      i=next===-1?html.length:next;
    }
  }
  return out;
}

// ============================================================
// 音声同期アニメーションエンジン
// ============================================================
let animTimers=[];
function clearAnimTimers(){
  animTimers.forEach(id=>clearTimeout(id));
  animTimers=[];
}
function getCell(boxId,pos){
  const box=document.getElementById(boxId);
  if(!box) return null;
  return box.querySelector(`[data-pos="${pos}"]`);
}
function applyAnimStep(step){
  const cell=getCell(step.boxId,step.pos);
  if(!cell) return;
  switch(step.type){
    case 'highlight':
      document.querySelectorAll('.slide9__cell--highlight').forEach(c=>c.classList.remove('slide9__cell--highlight'));
      cell.classList.add('slide9__cell--highlight');
      break;
    case 'set':
      cell.textContent=step.value;
      cell.classList.remove('slide9__cell--blank');
      cell.classList.add('slide9__cell--filled','slide9__cell--popin');
      setTimeout(()=>cell.classList.remove('slide9__cell--popin'),500);
      break;
    case 'clear':
      cell.textContent='';
      cell.classList.remove('slide9__cell--filled','slide9__cell--blank');
      break;
    case 'pop':
      cell.classList.remove('slide9__cell--popin');
      void cell.offsetWidth;
      cell.classList.add('slide9__cell--popin');
      setTimeout(()=>cell.classList.remove('slide9__cell--popin'),500);
      break;
    case 'reading':
      document.querySelectorAll('.slide9__cell--reading').forEach(c=>c.classList.remove('slide9__cell--reading'));
      cell.classList.add('slide9__cell--reading');
      break;
    case 'unhighlight':
      document.querySelectorAll('.slide9__cell--highlight').forEach(c=>c.classList.remove('slide9__cell--highlight'));
      document.querySelectorAll('.slide9__cell--reading').forEach(c=>c.classList.remove('slide9__cell--reading'));
      break;
    case 'dot':
      // 指定マスの右下に「.」を浮かび上がらせる
      if(!cell.querySelector('.slide9__cell-dot')){
        const dot=document.createElement('span');
        dot.className='slide9__cell-dot';
        dot.textContent='.';
        cell.appendChild(dot);
      }
      break;
  }
}
function runAnimations(animations){
  clearAnimTimers();
  if(!animations||animations.length===0) return;
  animations.forEach(step=>{
    const id=setTimeout(()=>applyAnimStep(step),Math.round(step.at*1000));
    animTimers.push(id);
  });
}

// ============================================================
let state={mode:'intro',category:'length',level:'i0',count:10,current:0,score:0,problem:null,startTime:0,answered:false};

function findLevelMeta(modeKey,levelKey){
  for(const stage of LEVELS[modeKey]) for(const it of stage.items) if(it.key===levelKey) return it;
  return null;
}

function renderLevelGrid(){
  const c=document.getElementById('level-container');
  c.innerHTML='';
  const stages=LEVELS[state.mode]||[];
  let firstAvail=null,currentValid=false;
  for(const stage of stages){
    const validItems=stage.items.filter(it=>it.cats.includes(state.category)&&hasTemplate(state.mode,state.category,it.key));
    if(validItems.length===0) continue;
    if(stage.name){
      const h=document.createElement('div');h.className='stage-header';h.textContent=stage.name;c.appendChild(h);
    }
    const grid=document.createElement('div');
    grid.className='choice-grid'+(validItems.length===1?' choice-grid--solo':'');
    for(const it of validItems){
      const btn=document.createElement('button');
      btn.className='choice';
      btn.dataset.level=it.key;
      btn.innerHTML=`<span class="choice__stars">${it.stars}</span>${it.label}<span class="choice__example">${it.example}</span>`;
      btn.addEventListener('click',()=>{
        document.querySelectorAll('#level-container .choice').forEach(b=>b.classList.remove('is-selected'));
        btn.classList.add('is-selected');
        state.level=it.key;
      });
      if(it.key===state.level){btn.classList.add('is-selected');currentValid=true;}
      if(!firstAvail) firstAvail=it;
      grid.appendChild(btn);
    }
    c.appendChild(grid);
  }
  if(!currentValid&&firstAvail){
    state.level=firstAvail.key;
    c.querySelector(`[data-level="${firstAvail.key}"]`)?.classList.add('is-selected');
  }
}

function hasTemplate(mode,cat,levelKey){
  if(cat==='mixed'){
    for(const c of ['length','volume','weight','area','cubic']) if(T[mode]?.[c]?.[levelKey]) return true;
    return false;
  }
  return !!T[mode]?.[cat]?.[levelKey];
}

function generateProblem(){
  if(state.mode==='intro'&&state.level==='i0'){
    return TUTORIAL[state.current%TUTORIAL.length]();
  }
  let cat=state.category;
  if(cat==='mixed'){
    const candidates=['length','volume','weight','area','cubic'].filter(c=>T[state.mode][c]?.[state.level]);
    cat=pick(candidates);
  }
  return pick(T[state.mode][cat][state.level])();
}

const MODES=[
  {key:'drill',icon:'📝',label:'単位ドリル',sub:'けいさんで練習'},
  {key:'word',icon:'📖',label:'文章題',sub:'おはなしで練習'},
];
let modalStage=0;

function openModal(stage){
  modalStage=stage;
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('modal-step').textContent=`STEP ${stage} / 3`;
  document.getElementById('modal-back').classList.toggle('hidden',stage===1);
  if(stage===1) renderCategoryModal();
  else if(stage===2) renderModeModal();
  else if(stage===3) renderLevelModal();
}
function closeModal(){
  modalStage=0;
  document.getElementById('modal-overlay').classList.add('hidden');
}

function renderCategoryModal(){
  document.getElementById('modal-title').textContent='① カテゴリをえらぶ';
  const body=document.getElementById('modal-body');
  body.className='modal__body modal-grid-2';
  body.innerHTML='';
  CATEGORIES.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.innerHTML=`<span class="choice__icon">${c.icon}</span>${c.label}<span class="choice__sub">${c.sub}</span>`;
    btn.onclick=()=>{state.category=c.key;openModal(2);};
    body.appendChild(btn);
  });
}

function renderModeModal(){
  document.getElementById('modal-title').textContent='② もんだいタイプ';
  const body=document.getElementById('modal-body');
  body.className='modal__body modal-grid-2';
  body.innerHTML='';
  MODES.forEach(m=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.innerHTML=`<span class="choice__icon">${m.icon}</span>${m.label}<span class="choice__sub">${m.sub}</span>`;
    btn.onclick=()=>{state.mode=m.key;openModal(3);};
    body.appendChild(btn);
  });
}

function renderLevelModal(){
  document.getElementById('modal-title').textContent='③ レベルをえらぶ';
  const body=document.getElementById('modal-body');
  body.className='modal__body';
  body.innerHTML='';
  const stages=LEVELS[state.mode]||[];
  let any=false;
  for(const stage of stages){
    const validItems=stage.items.filter(it=>it.cats.includes(state.category)&&hasTemplate(state.mode,state.category,it.key));
    if(validItems.length===0) continue;
    any=true;
    if(stage.name){
      const h=document.createElement('div');h.className='stage-header';h.textContent=stage.name;body.appendChild(h);
    }
    const grid=document.createElement('div');
    grid.className='choice-grid'+(validItems.length===1?' choice-grid--solo':'');
    for(const it of validItems){
      const btn=document.createElement('button');
      btn.className='choice';
      btn.innerHTML=`<span class="choice__stars">${it.stars}</span>${it.label}<span class="choice__example">${it.example}</span>`;
      btn.onclick=()=>{state.level=it.key;closeModal();startQuiz();};
      grid.appendChild(btn);
    }
    body.appendChild(grid);
  }
  if(!any){
    body.innerHTML='<p style="text-align:center;padding:20px;color:var(--ink-soft);">このカテゴリで使えるレベルがありません</p>';
  }
}

document.getElementById('modal-back').addEventListener('click',()=>{
  if(modalStage>1) openModal(modalStage-1);
});
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('modal-overlay').addEventListener('click',(e)=>{
  if(e.target.id==='modal-overlay') closeModal();
});

// ホーム2ボタン
document.getElementById('goto-intro-btn').addEventListener('click',()=>{
  state.mode='intro';state.category='length';state.level='i0';
  startQuiz();
});
document.getElementById('goto-start-btn').addEventListener('click',()=>{
  openModal(1);
});

function startQuiz(){
  state.current=0;state.score=0;state.startTime=Date.now();
  state.count=10;
  if(state.mode==='intro'&&state.level==='i0') state.count=TUTORIAL.length;
  showScreen('quiz');loadProblem();
}

function showScreen(name){
  ['start','quiz','result'].forEach(s=>{
    document.getElementById(`screen-${s}`).classList.toggle('hidden',s!==name);
  });
}

function loadProblem(){
  state.problem=generateProblem();
  state.answered=false;

  document.getElementById('mode-badge').textContent=state.mode==='drill'?'DRILL':state.mode==='word'?'STORY':'INTRO';
  const meta=findLevelMeta(state.mode,state.level);
  document.getElementById('lv-badge').textContent=meta?meta.stars.replace('STAGE ','').replace('LEVEL ','').replace('INTRO ','').replace('TUTORIAL','TUT'):state.level;
  document.getElementById('progress-text').textContent=`${state.current+1}/${state.count}`;
  document.getElementById('score-text').textContent=state.score;
  document.getElementById('progress-fill').style.width=`${(state.current/state.count)*100}%`;

  const charMap={kiro:'👑',mili:'🧚',centi:'🐢'};
  const c=state.problem.character;
  const charBubble=document.querySelector('.character-bubble');
  // 入門モードのスライドと練習はキャラクターヒントを表示しない
  if(state.mode==='intro'||!c){
    charBubble.classList.add('hidden');
  }else{
    charBubble.classList.remove('hidden');
    const charEl=document.getElementById('character-icon');
    charEl.textContent=charMap[c]||'';
    charEl.className='character '+(c==='mili'?'--mili':c==='centi'?'--centi':'');
    document.getElementById('character-line').textContent='いっしょに がんばろう！';
  }

  // 問題カードのラベル変更（slideは「まなぶ」）
  const qCard=document.getElementById('question-card');
  qCard.classList.toggle('question-card--slide',state.problem.type==='slide');

  const qEl=document.getElementById('question-text');
  qEl.innerHTML=state.problem.question;
  qEl.className=state.problem.type==='drill'?'question-text question-text--drill':'question-text';

  // チュートリアル(slide)は入力エリアを隠す
  const isSlide=state.problem.type==='slide';
  document.getElementById('answer-area').classList.toggle('hidden',isSlide);

  if(!isSlide){
    const expectsDecimal=state.problem.answer.values.some(v=>v%1!==0);
    const im=expectsDecimal?'decimal':'numeric';
    const row=document.getElementById('answer-row');
    row.innerHTML='';
    state.problem.answer.units.forEach((unit,i)=>{
      const group=document.createElement('div');
      group.className='input-group';
      group.innerHTML=`<input type="number" class="num-input" data-idx="${i}" inputmode="${im}" step="any" /><span class="unit-label">${unit}</span>`;
      row.appendChild(group);
    });
    setTimeout(()=>row.querySelector('.num-input')?.focus(),100);
  }

  document.getElementById('feedback-area').innerHTML='';

  // ボタン制御：slideのときは「もどる/つぎへ」と音声ボタン
  if(isSlide){
    document.getElementById('submit-btn').classList.add('hidden');
    document.getElementById('next-btn').classList.remove('hidden');
    document.getElementById('next-btn').textContent=state.current+1>=state.count?'🎓 入門おわり！':'つぎへ →';
    // もどるボタン（最初のスライド以外）
    const backBtn=document.getElementById('back-btn');
    if(state.current>0) backBtn.classList.remove('hidden');
    else backBtn.classList.add('hidden');
    // 音声ボタンと自動再生
    if(state.problem.narration){
      const fa=document.getElementById('feedback-area');
      fa.innerHTML=`<div class="audio-btn-row">
        <button class="audio-btn" id="replay-btn" type="button">🔊 もういちど きく</button>
        <button class="audio-btn audio-btn--toggle ${audioEnabled?'':'is-off'}" id="audio-toggle-btn" type="button">${audioEnabled?'🔉 音オン':'🔇 音オフ'}</button>
      </div>`;
      const playSlide=()=>{
        speak(state.problem.narration);
        runAnimations(state.problem.animations);
      };
      document.getElementById('replay-btn').onclick=playSlide;
      document.getElementById('audio-toggle-btn').onclick=()=>{
        audioEnabled=!audioEnabled;
        if(!audioEnabled) stopSpeak();
        const t=document.getElementById('audio-toggle-btn');
        t.textContent=audioEnabled?'🔉 音オン':'🔇 音オフ';
        t.classList.toggle('is-off',!audioEnabled);
        // 音オフ→オンの場合は音声＋アニメ両方再生
        // 音オフのままでも、ボタン押下時はアニメだけ走るのが自然なので
        playSlide();
      };
      // 自動再生（少し遅らせる）— 音声OFFでもアニメは進む
      setTimeout(playSlide,500);
    }else if(state.problem.animations&&state.problem.animations.length>0){
      // narrationなしでもanimationsだけ実行
      setTimeout(()=>runAnimations(state.problem.animations),500);
    }
  }else{
    document.getElementById('submit-btn').classList.remove('hidden');
    document.getElementById('next-btn').classList.add('hidden');
    document.getElementById('back-btn').classList.add('hidden');
  }
  // post-rowの空判定（両方hiddenなら非表示）
  const pr=document.getElementById('post-row');
  const bothHidden=document.getElementById('back-btn').classList.contains('hidden')&&document.getElementById('next-btn').classList.contains('hidden');
  pr.classList.toggle('is-empty',bothHidden);
}

function submitAnswer(){
  if(state.answered) return;
  if(state.problem.type==='slide'){
    advanceProblem();
    return;
  }
  const inputs=document.querySelectorAll('.num-input');
  const userValues=Array.from(inputs).map(i=>i.value===''?null:Number(i.value));
  if(userValues.some(v=>v===null||isNaN(v))){
    inputs.forEach(i=>{if(i.value==='') i.style.background='#FFE3DC';});
    return;
  }
  state.answered=true;
  const correct=state.problem.answer.values;
  const isCorrect=userValues.every((v,i)=>eq(v,correct[i]));
  if(isCorrect) state.score++;

  const fb=document.getElementById('feedback-area');
  const correctStr=correct.map((v,i)=>`${typeof v==='number'?(v%1===0?fmt(v):v):v}${state.problem.answer.units[i]}`).join(' ');
  fb.innerHTML=`<div class="feedback feedback--${isCorrect?'correct':'wrong'}"><div class="feedback__title">${isCorrect?'⭕ せいかい！':'❌ ざんねん！'}</div><div class="feedback__answer">こたえ：${correctStr}</div><div class="feedback__explain">💡 ${state.problem.explanation}</div></div>`;
  document.getElementById('submit-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
  document.getElementById('next-btn').textContent=state.current+1>=state.count?'🏆 けっか発表！':'つぎの問題 →';
  document.getElementById('post-row').classList.remove('is-empty');
}

function advanceProblem(){
  stopSpeak();clearAnimTimers();
  state.current++;
  if(state.current>=state.count) showResult();
  else loadProblem();
}

function goBack(){
  stopSpeak();clearAnimTimers();
  if(state.current>0){
    state.current--;
    loadProblem();
  }
}

document.getElementById('submit-btn').addEventListener('click',submitAnswer);
document.getElementById('next-btn').addEventListener('click',advanceProblem);
document.getElementById('back-btn').addEventListener('click',goBack);
document.getElementById('quit-btn').addEventListener('click',()=>{
  if(confirm('ホームにもどりますか？（とちゅうの結果は消えます）')){stopSpeak();clearAnimTimers();showScreen('start');}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!document.getElementById('screen-quiz').classList.contains('hidden')){
    if(state.problem?.type==='slide'){advanceProblem();return;}
    if(state.answered) advanceProblem();
    else submitAnswer();
  }
});

function showResult(){
  showScreen('result');
  const isTutorial=state.mode==='intro'&&state.level==='i0';
  const time=Math.round((Date.now()-state.startTime)/1000);

  if(isTutorial){
    document.getElementById('result-medal').textContent='🎓';
    document.getElementById('result-title').textContent='入門おわり！';
    document.getElementById('result-rank').textContent='たんいマスター見習い';
    // チュートリアルは正答率の代わりに完了表示
    document.getElementById('result-stats').innerHTML=`
      <div class="stat" style="grid-column:1/-1;"><div class="stat__num">📖</div><div class="stat__label">単位ボックスのしくみ、おぼえたね！</div></div>
      <div class="stat" style="grid-column:1/-1;"><div class="stat__num">${time}</div><div class="stat__label">じかん（秒）</div></div>`;
    return;
  }

  // ノーマル結果
  document.getElementById('result-stats').innerHTML=`
    <div class="stat"><div class="stat__num" id="stat-correct">${state.score}</div><div class="stat__label">せいかい</div></div>
    <div class="stat"><div class="stat__num" id="stat-total">${state.count}</div><div class="stat__label">もんだい数</div></div>
    <div class="stat"><div class="stat__num" id="stat-rate">${Math.round((state.score/state.count)*100)}%</div><div class="stat__label">せいかいりつ</div></div>
    <div class="stat"><div class="stat__num" id="stat-time">${time}</div><div class="stat__label">じかん（秒）</div></div>`;

  const rate=Math.round((state.score/state.count)*100);
  let medal,title,rank;
  if(rate===100){medal='👑';title='パーフェクト！';rank='RANK SS';}
  else if(rate>=90){medal='🏆';title='すごい！';rank='RANK S';}
  else if(rate>=70){medal='🥇';title='よくできました！';rank='RANK A';}
  else if(rate>=50){medal='🥈';title='もうすこし！';rank='RANK B';}
  else{medal='🥉';title='がんばろう！';rank='RANK C';}
  document.getElementById('result-medal').textContent=medal;
  document.getElementById('result-title').textContent=title;
  document.getElementById('result-rank').textContent=rank;
}

document.getElementById('retry-btn').addEventListener('click',startQuiz);
document.getElementById('home-btn').addEventListener('click',()=>{stopSpeak();clearAnimTimers();showScreen('start');});
</script>
</body>
</html>
